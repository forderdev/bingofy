name: Bootstrap Bingofy source

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore project files
        shell: bash
        run: |
          if [ ! -f .bootstrap/chunk_00 ]; then
            echo "Bootstrap payload already consumed."
            exit 0
          fi
          cat .bootstrap/chunk_* | base64 --decode > /tmp/bingofy.zip
          unzip -o /tmp/bingofy.zip -d .
          rm -rf .bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Bingofy application source"
          git push
