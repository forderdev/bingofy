<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bingofy</title>
<body style="margin:0;background:#080a10;color:#fff;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh"><div id="boot">Loading Bingofy…</div><script>
Promise.all(['site/part_00','site/part_01','site/part_02'].map(p=>fetch(p,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(p+' '+r.status);return r.text()}))).then(parts=>{document.open();document.write(parts.join(''));document.close()}).catch(err=>{document.getElementById('boot').textContent='Bingofy failed to load: '+err.message;console.error(err)})
</script>
